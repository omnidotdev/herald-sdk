name: release

# Publish @omnidotdev/herald to the Omni registry (Manifold) on a version tag.
# Requires the MANIFOLD_TOKEN repo secret (a write-scoped mf_ token for the
# omnidotdev namespace, minted at manifold.omni.dev). The registry target and
# auth resolution live in .npmrc + package.json publishConfig.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to publish (e.g. v0.1.0)
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Publish to Manifold
        env:
          MANIFOLD_TOKEN: ${{ secrets.MANIFOLD_TOKEN }}
        run: npm publish

name: Release 🏗️

# Changesets-driven release. On push to master, open (or update) the "version
# packages" PR; when that PR merges, version + tag the package and publish
# @omnidotdev/herald to the Manifold registry via `bun release`
# (changeset publish). Never release by hand-editing the version or tagging.
on:
  push:
    branches: [master]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Handle release 🦋
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          # pin Bun so the toolchain does not drift with floating latest
          bun-version: 1.3.6
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Create release PR or publish package
        id: changesets
        uses: changesets/action@v2
        with:
          publish-script: bun release
          pr-title: "feature(release): version packages"
          commit-message: "ci(changesets): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The committed .npmrc points @omnidotdev at the Manifold registry and
          # reads this write token (mf_...) for `changeset publish`. Fleet-standard
          # Manifold auth (see social/heartbeat). Stored in repo/org secrets.
          MANIFOLD_TOKEN: ${{ secrets.MANIFOLD_TOKEN }}
